[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lzctl"
dynamic = ["version"]
description = "Log in to many AWS accounts through any SAML 2.0 IdP, then run commands across your whole landing zone."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "lzctl contributors" }]
keywords = ["aws", "saml", "sso", "sts", "cli", "landing-zone", "multi-account"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "boto3>=1.34",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "click>=8.1",
    "pyyaml>=6.0",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
keyring = ["keyring>=24"]
excel = ["openpyxl>=3.1"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "openpyxl>=3.1"]

[project.scripts]
lzctl = "lzctl.cli:main"

[project.urls]
Homepage = "https://github.com/tgkhang/lzctl"
Issues = "https://github.com/tgkhang/lzctl/issues"

[tool.hatch.version]
path = "src/lzctl/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lzctl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
